name: Publish Desktop Stable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Verify Stable version
        id: version
        shell: pwsh
        run: |
          [xml]$project=Get-Content client-winui/ResumeStudio.csproj
          $version=[string]$project.Project.PropertyGroup.Version
          if($version -notmatch '^\d+\.\d+\.\d+$'){throw 'Invalid Stable version'}
          if($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version"){throw 'Tag and project version disagree'}
          if(!(Test-Path ".github/release-notes/v$version.md")){throw 'Release notes missing'}
          Add-Content $env:GITHUB_OUTPUT "version=$version"
      - name: Require successful signed Nightly for this source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-nightly-before-stable.ps1 -Commit "$env:GITHUB_SHA" -Version '${{ steps.version.outputs.version }}' -Repository "$env:GITHUB_REPOSITORY"
      - name: Install verified release JDK
        shell: pwsh
        run: ./scripts/setup-release-jdk.ps1
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Channel stable -BuildTag "v${{ steps.version.outputs.version }}"
          ./scripts/test-offline.ps1
          ./scripts/test-updater.ps1
          ./scripts/test-channel-publication.ps1
          ./scripts/test-schedule.ps1
          node --version
          ./scripts/test-features.ps1 -ReuseBackendTestClasses
          ./scripts/test-workbench.ps1
          ./scripts/test-resume-import.ps1 -TextOnly
          ./scripts/test-interviews.ps1 -ApplicationPath release/ResumeStudio/ResumeStudio.exe
          ./scripts/test-editor-navigation.ps1
          ./scripts/test-maintenance.ps1
          ./scripts/package.ps1
      - name: Install verified installer build tools
        shell: pwsh
        run: ./scripts/setup-installer-tools.ps1
      - name: Build and verify one-click installer
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1
          ./scripts/test-installer.ps1 -SetupPath "release/ResumeStudio-v${{ steps.version.outputs.version }}-Setup-x64.exe"
      - name: Sign update metadata
        shell: pwsh
        env:
          RESUMESTUDIO_UPDATE_SIGNING_KEY: ${{ secrets.RESUMESTUDIO_UPDATE_SIGNING_KEY }}
        run: ./scripts/sign-release.ps1 -PackagePath "release/ResumeStudio-v${{ steps.version.outputs.version }}-windows-x64.zip"
      - name: Include corresponding OpenJDK source
        shell: pwsh
        run: |
          $source='release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz'
          Invoke-WebRequest 'https://codeload.github.com/microsoft/openjdk-jdk21u/tar.gz/6f26c6b2b098814858e76ad2986c01d5e1c8987a' -OutFile $source
          $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release/SHA256SUMS.txt "$hash  microsoft-openjdk-jdk21u-6f26c6b2.tar.gz" -Encoding utf8
      - name: Publish Desktop Stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version='${{ steps.version.outputs.version }}'
          gh release create "v$version" "release/ResumeStudio-v$version-windows-x64.zip" "release/ResumeStudio-v$version-Setup-x64.exe" release/release-info.json release/release-info.sig release/release-changelog.json release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "拾简 Stable v$version" --latest --notes-file ".github/release-notes/v$version.md"
          if($LASTEXITCODE -ne 0){throw 'Stable publication failed'}
      - name: Publish signed Stable channel index
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-channel.ps1 -Channel stable
