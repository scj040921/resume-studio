name: Publish Desktop Nightly
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nightly-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Check for source changes
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha=(git rev-parse HEAD).Trim()
          $releases=gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Cannot query existing releases'}
          $last=@($releases|Where-Object {$_.prerelease -and !$_.draft -and $_.tag_name -match '^nightly-'}|Sort-Object published_at -Descending|Select-Object -First 1)
          if($last.Count -and $last[0].body.Contains("source-commit: $sha")){
            Add-Content $env:GITHUB_OUTPUT 'changed=false'
            Add-Content $env:GITHUB_OUTPUT "existing_tag=$($last[0].tag_name)"
            Write-Output 'Source unchanged since successful Nightly; no new release.'
            exit 0
          }
          if($last.Count -and $last[0].body -match 'source-commit: ([0-9a-f]{40})'){
            $previous=$Matches[1]
            git cat-file -e "$previous^{commit}" 2>$null
            if($LASTEXITCODE -eq 0){
              $changes=@(git diff --name-only $previous $sha -- client-winui backend ThirdParty installer scripts .github/workflows/nightly.yml .github/workflows/stable.yml .github/release-notes ':(exclude)scripts/*android*')
              if(!$changes.Count){Add-Content $env:GITHUB_OUTPUT 'changed=false';Add-Content $env:GITHUB_OUTPUT "existing_tag=$($last[0].tag_name)";exit 0}
            }
          }
          $now=[DateTimeOffset]::UtcNow.ToOffset([TimeSpan]::FromHours(8))
          $date=$now.ToString('yyyyMMdd')
          [xml]$project=Get-Content client-winui/ResumeStudio.csproj
          $base=[string]$project.Project.PropertyGroup.Version
          $short=$sha.Substring(0,8)
          Add-Content $env:GITHUB_OUTPUT 'changed=true'
          Add-Content $env:GITHUB_OUTPUT "tag=nightly-$date-$short"
          Add-Content $env:GITHUB_OUTPUT "label=$base-nightly.$date.$short"
          Add-Content $env:GITHUB_OUTPUT "sha=$sha"
      - name: Refresh channel index for unchanged Nightly
        if: steps.source.outputs.changed == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          gh release download '${{ steps.source.outputs.existing_tag }}' --repo "$env:GITHUB_REPOSITORY" -p release-info.json -p release-info.sig -D release
          if($LASTEXITCODE -ne 0){throw 'Cannot read existing signed Nightly metadata'}
          ./scripts/publish-channel.ps1 -Channel nightly
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: steps.source.outputs.changed == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Install verified release JDK
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/setup-release-jdk.ps1
      - name: Build and test Nightly
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Channel nightly -BuildTag '${{ steps.source.outputs.tag }}'
          ./scripts/test-offline.ps1
          ./scripts/test-updater.ps1
          ./scripts/test-channel-publication.ps1
          ./scripts/test-schedule.ps1
          node --version
          ./scripts/test-features.ps1 -ReuseBackendTestClasses
          ./scripts/test-workbench.ps1
          ./scripts/test-resume-import.ps1 -TextOnly
          ./scripts/test-interviews.ps1 -ApplicationPath release/ResumeStudio/ResumeStudio.exe
          ./scripts/test-editor-navigation.ps1
          ./scripts/test-interactions.ps1 -Smoke
          ./scripts/test-maintenance.ps1
          ./scripts/package.ps1 -PackageLabel '${{ steps.source.outputs.label }}'
      - name: Install verified installer build tools
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/setup-installer-tools.ps1
      - name: Build and verify one-click installer
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: |
          ./scripts/build-installer.ps1 -PackageLabel '${{ steps.source.outputs.label }}'
          ./scripts/test-installer.ps1 -SetupPath 'release/ResumeStudio-v${{ steps.source.outputs.label }}-Setup-x64.exe'
      - name: Sign update metadata
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        env:
          RESUMESTUDIO_UPDATE_SIGNING_KEY: ${{ secrets.RESUMESTUDIO_UPDATE_SIGNING_KEY }}
        run: ./scripts/sign-release.ps1 -PackagePath 'release/ResumeStudio-v${{ steps.source.outputs.label }}-windows-x64.zip'
      - name: Include corresponding OpenJDK source
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        run: |
          $source='release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz'
          Invoke-WebRequest 'https://codeload.github.com/microsoft/openjdk-jdk21u/tar.gz/6f26c6b2b098814858e76ad2986c01d5e1c8987a' -OutFile $source
          $hash=(Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content release/SHA256SUMS.txt "$hash  microsoft-openjdk-jdk21u-6f26c6b2.tar.gz" -Encoding utf8
      - name: Publish Desktop Nightly prerelease
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha='${{ steps.source.outputs.sha }}'
          $notes="Nightly 每日测试版，可能包含尚未稳定的改动。`n`n源码提交：$sha`n`n<!-- source-commit: $sha -->"
          $notes | Set-Content release/nightly-notes.md -Encoding utf8
          gh release create '${{ steps.source.outputs.tag }}' 'release/ResumeStudio-v${{ steps.source.outputs.label }}-windows-x64.zip' 'release/ResumeStudio-v${{ steps.source.outputs.label }}-Setup-x64.exe' release/release-info.json release/release-info.sig release/release-changelog.json release/microsoft-openjdk-jdk21u-6f26c6b2.tar.gz release/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target $sha --title '拾简 Nightly ${{ steps.source.outputs.tag }}' --prerelease --latest=false --notes-file release/nightly-notes.md
          if($LASTEXITCODE -ne 0){throw 'Nightly publication failed'}
      - name: Publish signed Nightly channel index
        if: steps.source.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-channel.ps1 -Channel nightly
